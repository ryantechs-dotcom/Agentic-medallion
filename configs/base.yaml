# Shared defaults for every experiment run. Condition files override keys from here.
# Values marked TBD are placeholders to decide (and log in docs/DECISIONS.md), not choices made.

paths:                      # data dir is not set here: ./data, or MEDRAG_DATA_DIR in .env
  eval_file: eval/questions.csv
  corpus_file: corpus/corpus_v1.jsonl   # built by scripts/build_corpus.py (gitignored)
  results_dir: results

generation:                 # keep fixed across all conditions and runs (D-next)
  backend: claude_cli       # claude_cli (headless Claude Code on a seat) | fake (dry runs, tests)
  model: claude-opus-5-5
  effort: high              # low | medium | high | xhigh | max; there is no temperature (D-next)
  prompt: answer_v1         # src/medrag/generation/prompts/answer_v1.txt
  timeout_s: 600            # per model call
  max_turns: 3              # CLI turns per call; no tools, so 1 is normal
  max_consecutive_errors: 3 # stop the run (and resume later) instead of burning seat usage

judge:                      # same backend and model as generation (D-next)
  prompt: judge_v1
  effort: high

retrieval:                  # "tokens" = whitespace-separated words (D18)
  k: 5
  kind: hybrid              # bm25 | dense | hybrid
  chunking: structure       # structure | fixed (ablation)
  max_chunk_tokens: 300     # structure chunking splits longer records (fits bge's 512 limit)
  fixed_chunk_tokens: 400   # used only when chunking = fixed
  fixed_chunk_overlap: 50
  bm25_stopwords: english   # english (NLTK list) | none; both compared on dev (D18)
  embedding_model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  fusion: rrf               # reciprocal rank fusion of BM25 and dense rankings
  rrf_k: 60
  candidates: 50            # depth each retriever contributes before fusion
  index_dir: corpus/index   # cached embeddings, keyed by a hash of the chunk texts (gitignored)

profile:
  top_k: 10                 # most frequent values returned by profile_column

verify:
  max_rows: 50              # cap rows returned by the SQL tool
  timeout_s: 10

eval:
  split: dev                # test only for the final run
