# Runs on every PR and push to main. No data snapshot here, so tests that need data/ skip,
# the same as for a teammate who hasn't unzipped it.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Style (PEP 8, 99 characters; scripts/legacy is kept as-is)
        run: python -m pycodestyle --max-line-length=99 --exclude=legacy src scripts tests
